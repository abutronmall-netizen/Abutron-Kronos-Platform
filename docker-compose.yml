services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abutron
      POSTGRES_USER: abutron
      POSTGRES_PASSWORD: change-me
    volumes:
      - abutron_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abutron -d abutron"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - abutron_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
    env_file:
      - .env
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap_catalog"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  outbox-worker:
    build:
      context: ./backend
    env_file:
      - .env
    command: ["python", "-m", "app.workers.outbox"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    build:
      context: ./backend
    env_file:
      - .env
    command: ["python", "-m", "app.workers.notifications"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  abutron_postgres:
  abutron_redis:
