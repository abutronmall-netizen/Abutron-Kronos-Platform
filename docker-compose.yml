name: abutron-production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ABUTRON_POSTGRES_DB:-abutron}
      POSTGRES_USER: ${ABUTRON_POSTGRES_USER:-abutron}
      POSTGRES_PASSWORD: ${ABUTRON_POSTGRES_PASSWORD:?ABUTRON_POSTGRES_PASSWORD is required}
    volumes:
      - abutron_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ABUTRON_POSTGRES_USER:-abutron} -d ${ABUTRON_POSTGRES_DB:-abutron}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - abutron_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    env_file: [.env]
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap_catalog"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    env_file: [.env]
    expose: ["8080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  admin:
    build:
      context: ./admin
    ports:
      - "${ABUTRON_ADMIN_BIND:-127.0.0.1}:${ABUTRON_ADMIN_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  outbox-worker:
    build:
      context: ./backend
    env_file: [.env]
    command: ["python", "-m", "app.workers.outbox"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    build:
      context: ./backend
    env_file: [.env]
    command: ["python", "-m", "app.workers.notifications"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  abutron_postgres:
  abutron_redis:
