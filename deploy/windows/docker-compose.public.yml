services:
  caddy:
    image: caddy:2-alpine
    environment:
      ABUTRON_PUBLIC_HOST: ${ABUTRON_PUBLIC_HOST:?ABUTRON_PUBLIC_HOST is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/windows/Caddyfile:/etc/caddy/Caddyfile:ro
      - abutron_caddy_data:/data
      - abutron_caddy_config:/config
    depends_on:
      admin:
        condition: service_started
    restart: unless-stopped

volumes:
  abutron_caddy_data:
  abutron_caddy_config:
