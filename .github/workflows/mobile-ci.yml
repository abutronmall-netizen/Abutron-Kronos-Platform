name: mobile-ci

on:
  push:
    branches: ["main", "production/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Install Expo-compatible native modules
        run: npm run setup
      - name: Typecheck
        run: npm run typecheck
      - name: Expo Doctor
        run: npx expo-doctor
