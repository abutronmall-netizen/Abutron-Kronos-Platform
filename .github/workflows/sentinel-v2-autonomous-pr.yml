name: Sentinel V2 Autonomous Qwen3 Draft PR

on:
  push:
    branches: [feature/sentinel-v2-sandbox-20261018]
    paths:
      - sentinel_v2_sandbox/agent/**
      - .github/workflows/sentinel-v2-autonomous-pr.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sentinel-autonomous-qwen3-branch
  cancel-in-progress: false

jobs:
  draft-pr-agent:
    if: github.repository == 'abutronmall-netizen/Abutron-Kronos-Platform' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout approved engineering branch without persisted credential
        uses: actions/checkout@v4
        with:
          ref: feature/sentinel-v2-sandbox-20261018
          persist-credentials: false

      - name: Validate bounded coding-worker policy without executing model code
        run: python3 -m unittest discover -s sentinel_v2_sandbox/agent -p 'test_worker_policy.py' -v

      - name: Pin and validate Qwen3 GGUF and llama.cpp executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sentinel-model
          curl -fL --retry 3 --connect-timeout 20 --max-time 300 --silent --show-error \
            -o /tmp/sentinel-model/llama-bin.tar.gz \
            https://github.com/ggml-org/llama.cpp/releases/download/b11719/llama-b11719-bin-ubuntu-x64.tar.gz
          printf '2c50edd1422cdc686a1620923a7dda9a33634509566d2821155fb3d4879510a3  %s\n' /tmp/sentinel-model/llama-bin.tar.gz | sha256sum -c -
          tar -xzf /tmp/sentinel-model/llama-bin.tar.gz -C /tmp/sentinel-model
          curl -fL --retry 3 --connect-timeout 20 --max-time 600 --silent --show-error \
            -o /tmp/sentinel-model/qwen3-4b.gguf \
            https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          printf '3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597  %s\n' /tmp/sentinel-model/qwen3-4b.gguf | sha256sum -c -

      - name: Launch authenticated loopback-only Qwen3 AI on disposable worker
        shell: bash
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "SENTINEL_EPHEMERAL_LLM_KEY=$key" >> "$GITHUB_ENV"
          /tmp/sentinel-model/llama-b11719/llama-server \
            --model /tmp/sentinel-model/qwen3-4b.gguf \
            --host 127.0.0.1 --port 18940 --api-key "$key" --no-webui \
            --ctx-size 4096 --parallel 1 --threads 3 --threads-batch 3 \
            --n-gpu-layers 0 --reasoning-format none \
            > /tmp/sentinel-model/inference.log 2>&1 &
          echo $! > /tmp/sentinel-model/server.pid
          for n in $(seq 1 50); do
            if curl -fsS -m 3 --header "Authorization: Bearer $key" \
              http://127.0.0.1:18940/v1/models > /dev/null; then
              echo 'LOCAL_QWEN3_MODEL_READY'; exit 0
            fi
            sleep 3
          done
          tail -40 /tmp/sentinel-model/inference.log
          exit 1

      - name: Prepare isolated Python container
        run: docker pull python:3.12-slim

      - name: Generate, test, inspect and bounded-retry new patch
        timeout-minutes: 10
        run: python3 sentinel_v2_sandbox/agent/worker.py

      - name: Verify model attempt and recovery provenance
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          info=json.loads(Path("agent-evidence/evaluations.json").read_text())
          assert info["approved_for_review"] is True
          assert info["production_approved"] is False
          assert info["generation_strategy"] in ("QWEN3_MODEL_TESTED", "REVIEWED_REFERENCE_FALLBACK")
          if info["generation_strategy"] == "REVIEWED_REFERENCE_FALLBACK":
              assert info["model_generated_patch"] is False
              assert info["model_failures_exhausted"] is True
          else:
              assert info["model_generated_patch"] is True
          assert info["attempts"][-1]["test_passed"] is True
          print("SAFE_REVIEW_ARTIFACT_SOURCE",info["generation_strategy"])
          PY

      - name: Upload agent evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-autonomous-qwen3-workflow-evidence
          path: agent-evidence/
          retention-days: 14

      - name: Create review-only PR using short-lived Actions token
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: abutronmall-netizen/Abutron-Kronos-Platform
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          B="sentinel/qwen3-sandbox-${GITHUB_RUN_ID}"
          git switch -c "$B"
          # Model output may include trailing whitespace; normalize presentation,
          # never changing the AST, before creating the review-only commit.
          sed -i 's/[[:blank:]]*$//' sentinel_v2_sandbox/generated/telemetry_fresh_candidate.py
          git add -- sentinel_v2_sandbox/generated/telemetry_fresh_candidate.py
          changed="$(git diff --cached --name-only)"
          if [[ "$changed" != "sentinel_v2_sandbox/generated/telemetry_fresh_candidate.py" ]]; then
            echo "DENY: no verified single-file patch or unapproved changed path: $changed" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "feat(sentinel): Qwen3 candidate tested in ephemeral sandbox"
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $header" push \
             "https://github.com/$GH_REPO.git" "HEAD:refs/heads/$B"
          STRATEGY="$(python3 -c 'import json;print(json.load(open("agent-evidence/evaluations.json"))["generation_strategy"])')"
          {
            echo "## Sentinel sandbox patch — independent review required"
            echo
            echo "Proposal provenance: $STRATEGY."
            if [[ "$STRATEGY" == "REVIEWED_REFERENCE_FALLBACK" ]]; then
              echo "**Qwen3 model attempts FAILED; patch uses a fixed reviewed reference implementation. This is NOT an AI-generated passing patch.**"
            else
              echo "Qwen3 generated the passing patch on this ephemeral runner."
            fi
            echo "Pinned Qwen3-4B was run on an ephemeral GitHub-hosted worker."
            echo "Code was AST-gated and executed ONLY in no-network, read-only, no-capabilities Docker."
            echo "The worker performed up to three bounded model/test retries; a fixed reference fallback may be used only for this one timestamp fixture."
            echo "No production credentials or broker interfaces were provided."
            echo
            echo "Workflow evidence: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "**NOT production authorized. Do not merge without distinct human review.**"
          } > /tmp/sentinel-pr-description.md
          gh pr create --repo "$GH_REPO" --head "$B" \
            --base feature/sentinel-v2-sandbox-20261018 --draft \
            --title "Sentinel sandbox tested candidate ($STRATEGY) — review $GITHUB_RUN_ID" \
            --body-file /tmp/sentinel-pr-description.md

      - name: Stop ephemeral model service
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/sentinel-model/server.pid ]; then
            kill "$(cat /tmp/sentinel-model/server.pid)" 2>/dev/null || true
          fi

  independent-draft-pr-validation:
    needs: [draft-pr-agent]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout generated draft PR branch on independent ephemeral worker
        uses: actions/checkout@v4
        with:
          ref: sentinel/qwen3-sandbox-${{ github.run_id }}
          persist-credentials: false

      - name: Verify GitHub draft PR and exact tested commit SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: abutronmall-netizen/Abutron-Kronos-Platform
        run: |
          set -euo pipefail
          BRANCH="sentinel/qwen3-sandbox-${GITHUB_RUN_ID}"
          gh pr list --repo "$GH_REPO" --head "$BRANCH" --state open \
            --json number,isDraft,headRefOid,baseRefName,author --limit 2 > /tmp/sentinel-pr-identity.json
          python3 - <<'PY'
          import json,subprocess
          items=json.load(open("/tmp/sentinel-pr-identity.json"))
          assert len(items)==1, "Expected exactly one open draft PR"
          item=items[0]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert item["isDraft"] is True, "Automatic PR must remain DRAFT"
          assert item["baseRefName"]=="feature/sentinel-v2-sandbox-20261018"
          assert item["headRefOid"]==head, "Head SHA mismatch"
          actor_info=json.loads(subprocess.check_output([
              "gh","api","repos/abutronmall-netizen/Abutron-Kronos-Platform/pulls/"+str(item["number"])
          ],text=True))
          assert actor_info["user"]["login"]=="github-actions[bot]", "Expected scoped GitHub Actions actor"
          print("DRAFT_REVIEW_ONLY_HEAD_VERIFIED",head)
          PY

      - name: Rerun candidate static AST gate without executing untrusted code
        shell: bash
        run: |
          python3 -m unittest discover -s sentinel_v2_sandbox/agent -p test_worker_policy.py -v
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          path=Path("sentinel_v2_sandbox/agent/worker.py")
          spec=importlib.util.spec_from_file_location("trusted_worker_policy",path)
          worker=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(worker)
          candidate=worker.CODE.read_text()
          validated=worker.validate(candidate)
          assert validated
          print("INDEPENDENT_AST_ALLOWLIST_PASS",len(validated))
          PY

      - name: Run hardened no-network Docker acceptance on independent runner
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-slim
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("trusted_worker_policy",Path("sentinel_v2_sandbox/agent/worker.py"))
          worker=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(worker)
          worker.EVIDENCE.mkdir(mode=0o700,exist_ok=True)
          passed,log=worker.isolated_test("independent-draft-pr")
          print(log[-1800:])
          if not passed: raise SystemExit("INDEPENDENT_PR_CI_FAILED")
          print("INDEPENDENT_PR_HEAD_SANDBOX_ACCEPTANCE_PASS")
          PY

      - name: Independent filesystem vulnerability and secret scan on exact PR head
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: sentinel_v2_sandbox
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload independent verification transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-independent-draft-pr-qa
          path: agent-evidence/
          retention-days: 14

# A passing run can ONLY open a DRAFT PR. It cannot merge, approve, change
# trading services, publish or deploy production. Promotion requires an
# independent human reviewer and separately proven rollback.
