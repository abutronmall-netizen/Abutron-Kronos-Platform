name: Sentinel V2 Autonomous Qwen3 Draft PR

on:
  push:
    branches: [feature/sentinel-v2-sandbox-20261018]
    paths:
      - sentinel_v2_sandbox/agent/**
      - .github/workflows/sentinel-v2-autonomous-pr.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sentinel-autonomous-qwen3-branch
  cancel-in-progress: false

jobs:
  draft-pr-agent:
    if: github.repository == 'abutronmall-netizen/Abutron-Kronos-Platform' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout approved engineering branch without persisted credential
        uses: actions/checkout@v4
        with:
          ref: feature/sentinel-v2-sandbox-20261018
          persist-credentials: false

      - name: Pin and validate Qwen3 GGUF and llama.cpp executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sentinel-model
          curl -fL --retry 3 --connect-timeout 20 --max-time 300 --silent --show-error \
            -o /tmp/sentinel-model/llama-bin.tar.gz \
            https://github.com/ggml-org/llama.cpp/releases/download/b11719/llama-b11719-bin-ubuntu-x64.tar.gz
          printf '2c50edd1422cdc686a1620923a7dda9a33634509566d2821155fb3d4879510a3  %s\n' /tmp/sentinel-model/llama-bin.tar.gz | sha256sum -c -
          tar -xzf /tmp/sentinel-model/llama-bin.tar.gz -C /tmp/sentinel-model
          curl -fL --retry 3 --connect-timeout 20 --max-time 600 --silent --show-error \
            -o /tmp/sentinel-model/qwen3-4b.gguf \
            https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          printf '3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597  %s\n' /tmp/sentinel-model/qwen3-4b.gguf | sha256sum -c -

      - name: Launch authenticated loopback-only Qwen3 AI on disposable worker
        shell: bash
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 32)
          echo "SENTINEL_EPHEMERAL_LLM_KEY=$key" >> "$GITHUB_ENV"
          /tmp/sentinel-model/llama-b11719/llama-server \
            --model /tmp/sentinel-model/qwen3-4b.gguf \
            --host 127.0.0.1 --port 18940 --api-key "$key" --no-webui \
            --ctx-size 4096 --parallel 1 --threads 3 --threads-batch 3 \
            --n-gpu-layers 0 --reasoning-format none \
            > /tmp/sentinel-model/inference.log 2>&1 &
          echo $! > /tmp/sentinel-model/server.pid
          for n in $(seq 1 50); do
            if curl -fsS -m 3 --header "Authorization: Bearer $key" \
              http://127.0.0.1:18940/v1/models > /dev/null; then
              echo 'LOCAL_QWEN3_MODEL_READY'; exit 0
            fi
            sleep 3
          done
          tail -40 /tmp/sentinel-model/inference.log
          exit 1

      - name: Prepare isolated Python container
        run: docker pull python:3.12-slim

      - name: Generate, test, inspect and bounded-retry new patch
        timeout-minutes: 10
        run: python3 sentinel_v2_sandbox/agent/worker.py

      - name: Upload agent evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-autonomous-qwen3-workflow-evidence
          path: agent-evidence/
          retention-days: 14

      - name: Create review-only PR using short-lived Actions token
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: abutronmall-netizen/Abutron-Kronos-Platform
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          B="sentinel/qwen3-sandbox-${GITHUB_RUN_ID}"
          git switch -c "$B"
          git add -- sentinel_v2_sandbox/generated/telemetry_fresh_candidate.py
          changed="$(git diff --cached --name-only)"
          if [[ "$changed" != "sentinel_v2_sandbox/generated/telemetry_fresh_candidate.py" ]]; then
            echo "DENY: no verified single-file patch or unapproved changed path: $changed" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "feat(sentinel): Qwen3 candidate tested in ephemeral sandbox"
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $header" push \
             "https://github.com/$GH_REPO.git" "HEAD:refs/heads/$B"
          {
            echo "## Qwen3-generated draft patch — independent review required"
            echo
            echo "Generated by an ephemeral GitHub Actions worker with pinned Qwen3-4B."
            echo "Code was AST-gated and executed ONLY in no-network, read-only, no-capabilities Docker."
            echo "The worker performed up to three bounded model/test retries."
            echo "No production credentials or broker interfaces were provided."
            echo
            echo "Workflow evidence: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "**NOT production authorized. Do not merge without distinct human review.**"
          } > /tmp/sentinel-pr-description.md
          gh pr create --repo "$GH_REPO" --head "$B" \
            --base feature/sentinel-v2-sandbox-20261018 --draft \
            --title "Sentinel Qwen3 generated patch — sandbox review $GITHUB_RUN_ID" \
            --body-file /tmp/sentinel-pr-description.md

      - name: Stop ephemeral model service
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/sentinel-model/server.pid ]; then
            kill "$(cat /tmp/sentinel-model/server.pid)" 2>/dev/null || true
          fi

# A passing run can ONLY open a DRAFT PR. It cannot merge, approve, change
# trading services, publish or deploy production. Promotion requires an
# independent human reviewer and separately proven rollback.
