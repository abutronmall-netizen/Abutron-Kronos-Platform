name: backend-ci

on:
  push:
    branches: ["main", "production/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Import application
        run: python -c "from app.main import app; assert app.title"

      - name: Validate migration SQL
        run: alembic upgrade head --sql > /tmp/abutron-schema.sql

      - name: Test
        run: pytest -q
